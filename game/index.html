<!doctype html>
<html lang="en">
<head>
<!-- This page is only the shell: the canvas, the stylesheet and the hidden status line for screen readers; the game itself is loaded from src/main.js. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Coast — a neon crime story (downtown, coast, pursuit)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  /* Read aloud, never shown: screen readers hear what the city is doing. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Velvet Coast: an open-world crime game. Walk the neon city on foot, take cars, outrun the police and work through five jobs."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
